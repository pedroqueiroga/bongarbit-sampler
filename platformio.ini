; PlatformIO Project Configuration File
;
; Hardware: ESP32-S3 N16R8 (16MB Quad flash + 8MB Octal PSRAM)
;         + PCM5102A I2S DAC breakout
;         + microSD card reader (SPI)
;
; See docs/circuit.md for the full wiring plan and pin justification.
;
; Two environments share src/, split by build_src_filter so only one sketch
; (one setup()/loop() pair) is compiled per build:
;   - esp32-s3-devkitc-1 (default): the sampler firmware, main.cpp
;   - sd_test: standalone SD card diagnostic, test_sd.cpp (uses the Arduino
;     core's own SD.h, not SdFat/M16 - useful to rule out a library-specific
;     issue when debugging SD hardware in isolation)
;
; Build/upload a specific one with: pio run -e sd_test -t upload
;
; A third environment, "native", builds nothing for the board: it runs the
; host-side unit suite in test/ against the model in sim/. See that section.
;
; The ESP32 settings live in [esp32_base] rather than [env] on purpose. [env]
; is inherited by EVERY environment, including native, which would then try to
; resolve an Xtensa toolchain to compile desktop tests.

[platformio]
default_envs = esp32-s3-devkitc-1

[esp32_base]
; M16 uses the new i2s_std driver, which needs Arduino core 3.x (ESP-IDF 5).
; The official PlatformIO "espressif32" platform does not provide it and is not
; going to: even the current 7.0.1 still pins framework-arduinoespressif32
; 3.20017 (= core 2.0.17), and the build fails with
;   M16.h: fatal error: driver/i2s_std.h: No such file or directory
; pioarduino is the community fork that tracks core 3.x. Pinned to an exact
; release rather than a range, because the toolchain is the one dependency
; whose silent drift would be hardest to debug from the audio symptoms.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; --- N16R8 memory configuration ---
; This is the N16R8 variant: 16MB Quad-SPI flash + 8MB Octal-SPI PSRAM. The
; generic "esp32-s3-devkitc-1" board is the N8 (8MB flash, NO PSRAM), so it
; used to be corrected here with a stack of board_build/board_upload
; overrides. Those did work - BOARD_HAS_PSRAM was defined and the 16MB
; partition table was applied - but they left board_upload.maximum_size at the
; N8's 8MB, so PlatformIO checked the firmware size against the wrong ceiling
; while writing a partition table that runs to 0xff0000.
;
; This platform ships a board definition for exactly this variant, which sets
; partitions, memory_type=qio_opi, psram_type=opi, BOARD_HAS_PSRAM and the
; correct 16MB size limits, coherently and in one place.
board = esp32-s3-devkitc1-n16r8
framework = arduino

build_flags =
    ; This board exposes only the native USB port (no separate CP2102/CH340
    ; UART bridge chip) - without this flag, Serial defaults to UART0 (GPIO
    ; 43/44), which isn't wired to anything, and the serial monitor stays
    ; empty even though the firmware is running fine.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The generic devkitc-1 board carried this in its extra_flags; the n16r8
    ; board definition does not, so it has to be stated explicitly or the USB
    ; CDC flag above has nothing to attach to and serial goes quiet again.
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-s3-devkitc-1]
extends = esp32_base
build_src_filter =
    +<*>
    -<test_sd.cpp>
    -<test_i2s_bench.cpp>
; M16 is pinned to an exact commit, for the same reason `platform` above is.
;
; It was unpinned until 11/10/2026, and that is not a hypothetical risk: the
; library rewrote its output transport while this project was being built on
; top of it. `i2s_write_samples()` used to issue one i2s_channel_write() per
; frame; it is now a [[deprecated]] shim over audioBlockWrite(), which
; accumulates M16_BLOCK_SIZE (32) frames and issues one DMA write per block.
; Same call, same audible result, ~19% of one core's time difference - the
; exact quantity docs/bancada.md section 9 was measuring. The same update also
; added a dual-core block-split mode in which the deprecated shim returns
; false and writes NOTHING, reachable by one default flipping upstream
; (setIsDualCore, currently false on ESP32).
;
; A floating dependency that can silently change the audio transport makes
; every bench number and every "validated on hardware" note in docs/ expire
; without notice. Pinned, a hardware result stays attached to something.
;
; CAVEAT: this pin is NOT the commit the 13-14/08/2026 bench ran against. That
; checkout was destroyed and re-cloned on 10/10/2026, and its commit is
; unrecoverable (the clone has a single reflog entry). So the DMA ladder and
; the four-voice result in docs/bancada.md need re-confirming against THIS
; version before they can be called validated again.
lib_deps =
    https://github.com/algomusic/M16.git#aef89b23ae449aa3c573833b61032a4ee134de33
    greiman/SdFat @ ^2.3.0

[env:sd_test]
extends = esp32_base
build_src_filter =
    +<test_sd.cpp>
    -<main.cpp>
    -<test_i2s_bench.cpp>

; Standalone I2S tone generator - no M16, no SdFat. Isolates "can this DAC make
; sound at all" from anything the sampler firmware or M16 might be doing wrong,
; the same way sd_test isolates the card from SdFat.
[env:i2s_bench]
extends = esp32_base
build_src_filter =
    +<test_i2s_bench.cpp>
    -<main.cpp>
    -<test_sd.cpp>

; --- Host-side unit tests: pio test -e native ---------------------------
; Compiles test/ plus the header-only model in sim/, with the desktop
; toolchain. src/ is not built (test_build_src defaults off), so no ESP32
; headers are involved and this runs anywhere g++ does.
;
; Always pass -e native. A bare "pio test" would also target the two ESP32
; environments, which means trying to upload to a board.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I sim
    -I src
    ; Unity compiles its double assertions out unless told otherwise, and
    ; silently FAILS them with "Double Precision Disabled" rather than skipping.
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-12
